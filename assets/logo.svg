<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#1A1A2E"/>

  <!-- Patrón de esquinas de un código QR: el gesto central de Yulia (escanear el QR) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16">
    <rect x="96" y="96" width="96" height="96" rx="16"/>
    <rect x="320" y="96" width="96" height="96" rx="16"/>
    <rect x="96" y="320" width="96" height="96" rx="16"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="128" y="128" width="32" height="32" rx="6"/>
    <rect x="352" y="128" width="32" height="32" rx="6"/>
    <rect x="128" y="352" width="32" height="32" rx="6"/>
  </g>

  <!-- Acento: datos entrando, en el azul del proyecto -->
  <g fill="#2563EB">
    <rect x="330" y="330" width="34" height="34" rx="6"/>
    <rect x="374" y="330" width="34" height="34" rx="6"/>
    <rect x="330" y="374" width="34" height="34" rx="6"/>
  </g>
</svg>
